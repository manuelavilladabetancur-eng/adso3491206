<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-advanced selectors</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        ul.fruits > li[class] {
            background-color: #ff7b00;
            padding: 0.2rem ;
        }
        ul.fruits > li + li[class] {
            background-color: #ff2600;
            padding: 0.2rem ;
        }
        ul.fruits > li + li + li[class] {
            background-color: #6bc900;
            padding: 0.2rem ;
        }
        ul.fruits > li+ li + li + li[class] {
            background-color: #ff0055;
            padding: 0.2rem ;
        }
        ul.fruits > li + li+ li + li +li[class] {
            background-color: #8400ff;
            padding: 0.2rem ;
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M112,56V200L40,128Z" opacity="0.2"></path><path d="M216,120H120V56a8,8,0,0,0-13.66-5.66l-72,72a8,8,0,0,0,0,11.32l72,72A8,8,0,0,0,120,200V136h96a8,8,0,0,0,0-16ZM104,180.69,51.31,128,104,75.31Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>05-advanced selectors</h1>
            <img src="../src/logo-css.png" alt="css">
            <ul>
                <li>children (>)</li>
                <li>adjacent/sibling</li>
                <li>attribute [class]</li>
            </ul>
        </header>
        <section>
            <h2 class="subtitle">example</h2>
            <ul class="fruits">
                <li class="highlight">🍊orange</li>
                <li class="highlight">🍎apple</li>
                <li class="highlight">🍋lemon</li>
                <li class="highlight">🍓strawberry</li>
                <li class="highlight">🍇grapes</li>
            </ul>
        </section>
    </main>
</body>
</html>
