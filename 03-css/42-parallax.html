<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42-Parallax</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        body {
            section {
                div.parallax {
                    border: 2px solid #fff;
                    border-radius: 12px;
                    corner-shape: squircle;
                    margin: 0 auto;
                    overflow: hidden;
                    position: relative;
                    width: 360px;
                    height: 576px;

                    div.layer8, div.layer7,
                    div.layer6, div.layer5,
                    div.layer4, div.layer3,
                    div.layer2, div.layer1 {
                        position: absolute;
                        top: 0;
                        left: 0;
                        height: 576px;
                        width: 1024px;
                    }


                    div.layer8 {
                        background: url(../src/imgs/layer_08.png) repeat-x;
                    }
                    div.layer7 {
                        background: url(../src/imgs/layer_07.png) repeat-x;
                        animation: 40s animLayer linear infinite;
                    }
                    div.layer6 {
                        background: url(../src/imgs/layer_06.png) repeat-x;
                        animation: 35s animLayer linear infinite;
                    }
                     div.layer5 {
                        background: url(../src/imgs/layer_05.png) repeat-x;
                        animation: 30s animLayer linear infinite;
                    }
                     div.layer4 {
                        background: url(../src/imgs/layer_04.png) repeat-x;
                        animation: 25s animLayer linear infinite;
                    }
                     div.layer3 {
                        background: url(../src/imgs/layer_03.png) repeat-x;
                        animation: 20s animLayer linear infinite;
                    }
                     div.layer2 {
                        background: url(../src/imgs/layer_02.png) repeat-x;
                        animation: 10s animLayer linear infinite;
                    }
                     div.layer1 {
                        background: url(../src/imgs/layer_01.png) repeat-x;
                        animation: 5s animLayer linear infinite;
                    }
                    div.runner {
                        position: absolute;
                        bottom: 5rem;
                        left: 50%;
                        transform: translateX(-50%) scale(.6);
                        width: 200px;
                        height: 200px;
                        background: url(../src/imgs/running.gif)
                                    no-repeat center / cover;
                    }

                }
            }
        }
        @keyframes animLayer {
            100% {background-position-x: -1024px ;}
        }
    </style>
</head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M128,26A102,102,0,1,0,230,128,102.12,102.12,0,0,0,128,26Zm0,192a90,90,0,1,1,90-90A90.1,90.1,0,0,1,128,218Zm46-90a6,6,0,0,1-6,6H102.49l21.75,21.76a6,6,0,1,1-8.48,8.48l-32-32a6,6,0,0,1,0-8.48l32-32a6,6,0,0,1,8.48,8.48L102.49,122H168A6,6,0,0,1,174,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu">
            <h1>42-Parallax</h1>
            <img src="../src/logo-css.png" alt="">
            <h3>Move at a different speed the backgrounds.</h3>
        </header>
        <section>
            <h2 class="subtitle">Example:</h2>
            <div class="parallax">
                <div class="layer8"></div>
                <div class="layer7"></div>
                <div class="layer6"></div>
                <div class="layer5"></div>
                <div class="layer4"></div>
                <div class="layer3"></div>
                <div class="layer2"></div>
                <div class="layer1"></div>
                <div class="runner"></div>
            </div>
        </section>
    </main>
</body>
</html>
